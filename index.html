<!doctype html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Keep this site out of search engines (see also robots.txt) -->
  <meta name="robots" content="noindex, nofollow, noarchive">
  <meta name="googlebot" content="noindex, nofollow, noarchive">

  <title>SOT Playbook</title>
  <meta name="description" content="Internal playbook for stream operators.">
  <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">

  <!-- Font: Lexend from Google Fonts (free) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lexend:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">

  <!-- Apply the saved light/dark choice before the page draws, so it doesn't flash -->
  <script>
    try { var t = localStorage.getItem('theme'); if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t; } catch (e) {}
  </script>
</head>
<body>
  <button class="skip-link" type="button" id="skipLink">Skip to content</button>

  <!-- ===== Top bar ===== -->
  <header class="topbar">
    <div class="topbar-inner">
      <a class="logo" href="#/" aria-label="Home">
        <span class="logo-mark" aria-hidden="true"></span>
        <span class="logo-text" id="logoText">SOT Playbook</span>
      </a>

      <nav class="nav" id="nav" aria-label="Sections">
        <ul id="navList"><!-- filled from data/site.json --></ul>
      </nav>

      <div class="topbar-actions">
        <button class="icon-btn" type="button" id="searchBtn" aria-label="Search (press /)">
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
        </button>
        <button class="icon-btn" type="button" id="themeBtn" aria-label="Switch to light theme">
          <svg class="i-sun" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
          <svg class="i-moon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>
        </button>
        <button class="icon-btn menu-btn" type="button" id="menuBtn" aria-label="Open menu" aria-expanded="false" aria-controls="nav">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
      </div>
    </div>
  </header>

  <!-- ===== Page content (drawn by js/app.js) ===== -->
  <main id="main" tabindex="-1">
    <noscript><p class="alert">This site needs JavaScript turned on.</p></noscript>
    <p class="loading">Loading…</p>
  </main>

  <!-- ===== Footer ===== -->
  <footer class="footer">
    <p><span id="footerText">Strategy &amp; Training | 2026</span> · <span id="creditsText">[CREDITS]</span></p>
  </footer>

  <!-- ===== Search window ===== -->
  <dialog class="search" id="searchDialog" aria-label="Search the playbook">
    <form class="search-bar" id="searchForm" role="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.6-3.6"/></svg>
      <input type="search" id="searchInput" placeholder="Search strategies, goals, terms…" autocomplete="off" aria-label="Search" aria-controls="searchResults">
      <button type="button" class="search-close" id="searchClose" aria-label="Close search">Esc</button>
    </form>
    <div class="search-results" id="searchResults" role="region" aria-live="polite"></div>
  </dialog>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="js/app.js"></script>
</body>
</html>
